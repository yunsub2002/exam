<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Speak Up IH v2 (노트북)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Gothic+A1:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: 앱 셸 — 데스크톱 좌측 레일 / 모바일 하단 탭바. 메인 컬러는 마닐라 만(灣) 해질녘: 딥 블루 + 망고 옐로, 대화 말풍선이 주인공 */
:root{
 --bg:#F2F4F9;--surface:#FFFFFF;--ink:#101B33;--sub:#56627D;--mut:#8C96AD;--line:#E1E6F0;
 --brand:#2443B8;--brand-soft:#E5EAFB;--sun:#FFB21E;--sun-soft:#FFF3D6;--sun-ink:#7A4B00;
 --ok:#0E8F6A;--ok-soft:#E1F5EE;--bad:#C93A30;--bad-soft:#FCE7E4;--bubble-me:#2443B8;--on-brand:#FFFFFF;
 --f-disp:'Outfit','Gothic A1',sans-serif;--f-body:'Gothic A1','Malgun Gothic','Apple SD Gothic Neo',sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1222;--surface:#141D33;--ink:#EAF0FB;--sub:#A8B3CC;--mut:#77829C;--line:#243152;--brand:#8EA6FF;--brand-soft:#1C2A52;--sun:#FFC24D;--sun-soft:#3A2C0C;--sun-ink:#FFDB8A;--ok:#4FD3A6;--ok-soft:#12352A;--bad:#FF8C80;--bad-soft:#3C1916;--bubble-me:#3552C9;--on-brand:#0B1222;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1222;--surface:#141D33;--ink:#EAF0FB;--sub:#A8B3CC;--mut:#77829C;--line:#243152;--brand:#8EA6FF;--brand-soft:#1C2A52;--sun:#FFC24D;--sun-soft:#3A2C0C;--sun-ink:#FFDB8A;--ok:#4FD3A6;--ok-soft:#12352A;--bad:#FF8C80;--bad-soft:#3C1916;--bubble-me:#3552C9;--on-brand:#0B1222;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav.rail{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.logo{font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0 8px 18px;display:flex;align-items:center;gap:8px}
.logo i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--sun);color:#101B33;font-style:normal;font-size:14px}
.logo small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;color:var(--mut);letter-spacing:.04em}
nav button.tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--sub)}
nav button.tab:hover{background:var(--bg)}
nav button.tab.on{background:var(--brand-soft);color:var(--brand)}
nav button.tab:focus-visible{outline:2px solid var(--brand)}
nav .ic{width:20px;text-align:center;font-size:16px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--mut);padding:0 8px}
main{min-width:0;padding-block:26px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-disp);font-size:30px;line-height:1.2;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:18px;margin:0 0 10px;text-wrap:balance}
h3{font-size:15px;margin:0 0 6px}
p{margin:0}
.lead{color:var(--sub);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi b{display:block;font-family:var(--f-disp);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--sub)}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{filter:brightness(1.08);color:var(--on-brand)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#101B33}
.btn.sm{font-size:12.5px;padding:6px 11px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand)}
.tag.sun{background:var(--sun-soft);color:var(--sun-ink)}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.hero{background:var(--ink);color:var(--bg);border-radius:20px;padding:26px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:center;border:0}
.hero h1{color:var(--bg)}
.hero p{color:var(--mut);margin-top:8px}
.levels{display:flex;gap:4px;margin-top:16px;flex-wrap:wrap}
.levels span{font-family:var(--f-mono);font-size:11.5px;padding:4px 8px;border-radius:6px;background:rgba(127,140,170,.18);color:var(--mut)}
.levels span.t{background:var(--sun);color:#101B33;font-weight:700}
.joycard{background:var(--surface);color:var(--ink);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:flex-start}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--sun),#FF7A59);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;color:#101B33;font-size:18px}
.mission{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mission:first-of-type{border-top:0}
.mission .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
.mission.done .ck{background:var(--ok);border-color:var(--ok);color:var(--on-brand)}
.mission div{flex:1;min-width:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.week i{height:34px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--mut)}
.week i.on{background:var(--sun);color:#101B33;font-weight:700}
/* 공략집 */
.toc{display:flex;gap:8px;flex-wrap:wrap}
.guide h2{font-family:var(--f-disp);font-size:20px}
.guide table{width:100%;border-collapse:collapse;font-size:14px}
.guide th,.guide td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.guide th{font-size:12.5px;color:var(--sub);font-weight:700}
.tw{overflow-x:auto}
.formula{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.formula div{background:var(--bg);border-radius:12px;padding:12px}
.formula b{display:block;font-family:var(--f-disp);color:var(--brand)}
.formula span{font-size:13px;color:var(--sub)}
ul.li{margin:0;padding-left:18px}ul.li li{margin-bottom:6px}
/* 대화 */
.chatwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.chat{display:flex;flex-direction:column;height:min(70vh,640px);padding:0;overflow:hidden}
.chathead{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.chathead .st{font-size:12px;color:var(--ok)}
.msgs{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.msg{display:flex;gap:10px;max-width:86%}
.msg .av{width:34px;height:34px;font-size:13px}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;min-width:0}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bub{background:var(--bubble-me);color:#fff;border-color:transparent;border-radius:16px 4px 16px 16px}
.bub .tools{display:flex;gap:6px;margin-top:6px}
.bub .tools button{all:unset;cursor:pointer;font-size:12px;color:var(--brand);font-weight:700}
.msg.me .bub .tools button{color:#DDE4FF}
.fix{margin-top:8px;background:var(--sun-soft);color:var(--sun-ink);border-radius:10px;padding:8px 10px;font-size:13px}
.fix b{color:inherit}
.fix s{opacity:.7}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end;background:var(--surface)}
.composer textarea{flex:1;min-width:0;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);resize:none;height:46px;max-height:140px}
.mic{width:46px;height:46px;border-radius:50%;border:0;background:var(--sun);color:#101B33;font-size:18px;cursor:pointer;flex:none}
.inp{display:block;width:100%;margin-top:4px;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink)}
.hfst{padding:8px 16px;font-size:13px;font-weight:600;color:var(--bad);background:var(--bad-soft);border-bottom:1px solid var(--line)}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.mic.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,58,48,.5)}100%{box-shadow:0 0 0 14px rgba(201,58,48,0)}}
.side .card+.card{margin-top:12px}
.topicbtns{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:12.5px;color:var(--sub);background:var(--bg);border-radius:10px;padding:10px}
/* 모의고사 */
.qbox{font-size:18px;line-height:1.6;font-family:var(--f-disp);font-weight:500}
.qbox.hide{filter:blur(6px);user-select:none}
.timer{font-family:var(--f-mono);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brand)}
textarea.ans{width:100%;min-height:150px;font:inherit;font-size:15px;line-height:1.7;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink)}
.survey{display:flex;flex-wrap:wrap;gap:8px}
.survey label{display:flex;gap:6px;align-items:center;background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.res{border-top:1px solid var(--line);padding:14px 0}
.res:first-child{border-top:0}
.mini{font-family:var(--f-mono);font-size:12px;color:var(--sub)}
/* 모범답안 */
.mlist{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.mitems{display:flex;flex-direction:column;gap:6px;position:sticky;top:16px}
.mitems button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--sub);background:var(--surface);border:1px solid var(--line)}
.mitems button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.sent{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;cursor:pointer}
.sent:hover{background:var(--bg)}
.sent.play{background:var(--sun-soft)}
.sent .n{font-family:var(--f-mono);font-size:11px;color:var(--mut);margin-top:3px;flex:none;width:18px}
.sent p{font-size:16px;line-height:1.7}
mark.k{background:var(--sun-soft);color:var(--sun-ink);border-radius:4px;padding:0 3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;z-index:30;max-width:90vw}
@media (max-width:960px){.chatwrap,.mlist{grid-template-columns:1fr}.mitems{position:static;flex-direction:row;flex-wrap:wrap}.hero{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.formula{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
 .shell{grid-template-columns:1fr}
 nav.rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:20;gap:0}
 nav .logo,.rail .foot{display:none}
 nav button.tab{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1;text-align:center;align-items:center}
 .g2,.g3{grid-template-columns:1fr}
 h1{font-size:25px}
 .chat{height:calc(100vh - 210px)}
}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}}
/* 통화 모드 (v2) */
[hidden]{display:none!important}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer;line-height:1.4}
.chk input{margin-top:3px;flex:none}
.chat.incall{height:min(84vh,780px)}
.call{border-top:1px solid var(--line);background:var(--surface);padding:16px 16px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.orb{position:relative;width:78px;height:78px;display:grid;place-items:center;margin-top:4px}
.orb .av{width:70px;height:70px;font-size:26px;position:relative;z-index:1}
.orb::before,.orb::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:3px solid transparent}
.call[data-s=listening] .orb::before{border-color:var(--ok);animation:ring 1.5s ease-out infinite}
.call[data-s=listening] .orb::after{border-color:var(--ok);opacity:.35}
.call[data-s=speaking] .orb::before{border-color:var(--sun);animation:ring .8s ease-out infinite}
.call[data-s=speaking] .orb::after{border-color:var(--sun);animation:ring .8s ease-out .4s infinite}
.call[data-s=thinking] .orb::before{border-color:var(--brand);border-right-color:transparent;border-bottom-color:transparent;animation:spin .8s linear infinite}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.cstate{font-weight:700;font-size:12.5px;color:var(--sub);text-align:center;min-height:19px}
.cap{width:100%;max-width:680px;min-height:56px;max-height:120px;overflow-y:auto;text-align:center;font-family:var(--f-disp);font-weight:500;font-size:19px;line-height:1.45;color:var(--ink)}
.cap.me{color:var(--brand)}
.cbtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cbtns .btn.on{background:var(--sun);border-color:var(--sun);color:#101B33}
.ct{font-family:var(--f-mono);font-weight:600;opacity:.85}
.kb{font-size:11px;opacity:.8}
.hints{display:flex;flex-direction:column;gap:6px;width:100%;max-width:680px}
.hint{all:unset;cursor:pointer;background:var(--sun-soft);color:var(--sun-ink);border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.45}
.hint:focus-visible{outline:2px solid var(--brand)}
.hint span{display:block;font-size:12px;opacity:.85;margin-top:2px}
.btn.glow{border-color:var(--sun);animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,178,30,.0)}50%{box-shadow:0 0 0 6px rgba(255,178,30,.35)}}
.fix.say{background:var(--ok-soft);color:var(--ok)}
.fix .rp{all:unset;cursor:pointer;font-size:12px;margin-left:2px}
.kotag{font-size:12px}
.dots{display:inline-flex;gap:4px;padding:4px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.report{position:fixed;inset:0;background:rgba(8,14,30,.55);display:grid;place-items:center;z-index:40;padding:16px}
.report>.card{width:100%;max-width:580px;max-height:88vh;overflow-y:auto}
.report .fix{margin-top:8px}
.report .tools button{all:unset;cursor:pointer;font-size:12px;font-weight:700;color:inherit;margin-right:10px}
@media (max-width:760px){.chat.incall{height:calc(100vh - 150px)}.cap{font-size:17px}}
@media (prefers-reduced-motion:reduce){.orb::before,.orb::after,.dots i,.btn.glow{animation:none!important}}
</style>

 <nav class="rail" id="rail" aria-label="메뉴">
  <div class="logo"><i>IH</i><div>Speak Up IH<small>OPIc 스피킹 코치</small></div></div>

 <main><div class="page" id="page"></div></main>

<div class="toast" id="toast" hidden></div>
<script>

// ===== 문제 은행 =====
// t: 주제, s: 설문(서베이) 주제 여부, q: [묘사, 루틴/비교, 경험]
const TOPICS={
 home:{ko:'집 · 거주지',s:true,q:["I would like to know where you live. Describe your home to me. What does it look like? How many rooms are there?","What do you usually do at home on weekdays and on weekends? Tell me about your daily routine at home.","Has your home changed over the years? Tell me about a memorable change or something special that happened at your home."]},
 town:{ko:'동네 · 이웃',s:true,q:["Tell me about the neighborhood you live in. What does it look like and what kinds of places are there?","Talk about the people in your neighborhood. What do you usually do together?","How has your neighborhood changed since you first moved there? Give me as many details as possible."]},
 jog:{ko:'조깅 · 러닝',s:true,q:["You indicated that you go jogging. Where do you usually go jogging and why do you like that place?","Describe your typical jogging routine. What do you do before, during and after you run?","Tell me about a memorable experience you had while jogging. What happened and how did you feel?"]},
 park:{ko:'공원 가기',s:true,q:["You said you like going to parks. Describe your favorite park. What does it look like?","What do you usually do when you go to the park? Who do you go with?","Tell me about a special or unexpected experience you had at a park."]},
 movie:{ko:'영화 보기',s:true,q:["You indicated that you enjoy watching movies. What kinds of movies do you like and why?","Describe what you usually do when you go to the movies, from start to finish.","Tell me about the most memorable movie you have seen recently. What was it about and why was it memorable?"]},
 music:{ko:'음악 감상',s:true,q:["What kind of music do you like to listen to? Who are your favorite singers or musicians?","When and where do you usually listen to music? What devices do you use?","How has your taste in music changed since you were young? Tell me about it in detail."]},
 travel:{ko:'해외여행',s:true,q:["Tell me about a country or city you have visited abroad. What was it like?","What do you usually do to prepare for an overseas trip? Describe the process.","Tell me about a memorable experience from an overseas trip. Something funny, surprising or difficult."]},
 staycation:{ko:'집에서 보내는 휴가',s:true,q:["When you have time off, what do you usually do at home? Who do you spend time with?","Tell me about the last vacation you spent at home. What did you do each day?","Have you ever had an unexpected problem during a vacation at home? What happened?"]},
 work:{ko:'회사 · 업무',s:true,q:["Tell me about your company and your job. What do you do at work?","Describe a typical day at your workplace, from the morning until you leave.","Tell me about a challenging project you worked on. What was the problem and how did you solve it?"]},
 tech:{ko:'돌발: 기술 · 인터넷',s:false,q:["What kinds of technology do you use every day? How do they help you?","How has the technology people use changed compared to ten years ago?","Tell me about a time when a piece of technology did not work properly. What did you do?"]},
 recycle:{ko:'돌발: 재활용',s:false,q:["Describe how people recycle in your country. What items do they separate?","What do you personally do to recycle at home? Describe the process.","Has recycling changed in your country over the years? What do you think about it?"]},
 weather:{ko:'돌발: 날씨 · 계절',s:false,q:["Describe the weather in your country. How is each season different?","What do people usually do in your country during the summer and the winter?","Tell me about a memorable experience related to extreme weather."]}
};

function enVoices(){if(!('speechSynthesis' in window))return[];return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}
function voiceScore(v){let s=0;if(/natural|neural|online/i.test(v.name))s+=50;if(/en[-_]PH/i.test(v.lang))s+=30;if(/google/i.test(v.name))s+=20;if(/en[-_]US/i.test(v.lang))s+=10;if(/rosa|ava|emma|jenny|aria|samantha|zira|female/i.test(v.name))s+=5;return s}
function pickVoice(){const vs=enVoices();if(!vs.length)return;VOICE=(VOICE_NAME&&vs.find(v=>v.name===VOICE_NAME))||vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null;fillVoiceSel()}
function fillVoiceSel(){const s=document.getElementById('vSel');if(!s)return;const vs=enVoices().slice().sort((a,b)=>voiceScore(b)-voiceScore(a));s.innerHTML=vs.map(v=>`<option value="${esc(v.name)}" ${VOICE&&v.name===VOICE.name?'selected':''}>${esc(v.name.replace(/^Microsoft /,'').replace(/ - English/,' ·'))} (${esc(v.lang)})</option>`).join('')||'<option>기본 음성</option>'}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}

const TT={q:[],busy:false,closed:true,done:null,cur:'',gen:0,rate:null,keep:[]};
let onTTS=null;function ttsUI(){onTTS&&onTTS(TT.cur)}
function cleanTTS(s){return String(s||'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'').replace(/[*_#`]/g,'').replace(/\s+/g,' ').trim()}
function splitSents(t){return (cleanTTS(t).match(/[^.!?]+[.!?]+["')\]]*|[^.!?]+$/g)||[]).map(s=>s.trim()).filter(Boolean)}
function ttsCancel(){TT.gen++;TT.q=[];TT.busy=false;TT.cur='';TT.done=null;TT.closed=true;if('speechSynthesis' in window)window.speechSynthesis.cancel();ttsUI()}
function ttsStart(onDone,rate){ttsCancel();TT.closed=false;TT.done=onDone||null;TT.rate=rate||null}
function ttsPush(s){s=cleanTTS(s);if(!s)return;TT.q.push(s);ttsPump()}
function ttsClose(){TT.closed=true;ttsPump()}
function ttsPump(){
 if(TT.busy)return;
 if(!TT.q.length){if(TT.closed){TT.cur='';ttsUI();if(TT.done){const d=TT.done;TT.done=null;d()}}return}
 const s=TT.q.shift(),g=TT.gen;TT.busy=true;TT.cur=s;ttsUI();
 if(!('speechSynthesis' in window)){TT.busy=false;setTimeout(ttsPump,0);return}
 let guard=null;const next=()=>{if(g!==TT.gen)return;clearTimeout(guard);TT.busy=false;ttsPump()};
 const u=new SpeechSynthesisUtterance(s);if(VOICE)u.voice=VOICE;u.lang=VOICE?VOICE.lang:'en-US';u.rate=TT.rate||RATE;u.onend=next;u.onerror=next;
 TT.keep.push(u);if(TT.keep.length>30)TT.keep.shift();
 guard=setTimeout(next,s.length*110/u.rate+6000);
 try{speechSynthesis.resume()}catch(_){}speechSynthesis.speak(u)}

function makeLocalAI(){
 const URL_='https://api.anthropic.com/v1/messages';
 async function post(body){let res;
  try{res=await fetch(URL_,{method:'POST',headers:{'content-type':'application/json','x-api-key':KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)})}
  catch(e){const er=new Error('network');er.code='network';throw er}
  if(!res.ok){let msg='';try{msg=((await res.json()).error||{}).message||''}catch(_){}const er=new Error(msg||('HTTP '+res.status));er.code=res.status===401?'bad_key':res.status===429?'rate_limited':res.status===404?'bad_model':'http';er.detail=msg;throw er}
  return res}
 async function call(prompt,opts={}){
  const model=opts.modelTier==='quick'?MODEL_Q:MODEL_D;
  const res=await post({model,max_tokens:opts.max||1200,messages:[{role:'user',content:prompt}]});
  const j=await res.json();return {text:(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('')}}
 const f=(p,o)=>call(p,o);
 f.json=async(p,o)=>{const r=await call(p+'\n\nReturn ONLY valid JSON. No markdown fences.',{...(o||{}),max:(o&&o.max)||3000});const j=parseJSON(r.text);if(!j){const er=new Error('bad json');er.code='bad_json';throw er}return j};
 // 스트리밍: 첫 문장이 오자마자 Joy가 말하기 시작 → 체감 대기시간 대폭 감소
 f.stream=async(prompt,opts={},onText)=>{
  const model=opts.modelTier==='quick'?MODEL_Q:MODEL_D;
  const res=await post({model,max_tokens:opts.max||700,stream:true,messages:[{role:'user',content:prompt}]});
  if(!res.body||!res.body.getReader){const j=await res.json();const t=(j.content||[]).map(c=>c.text||'').join('');onText&&onText(t);return {text:t}}
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',full='';
  for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
   while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;
    let j=null;try{j=JSON.parse(line.slice(5).trim())}catch(_){continue}
    if(j.type==='content_block_delta'&&j.delta&&j.delta.type==='text_delta'){full+=j.delta.text;onText&&onText(full)}
    else if(j.type==='error'){const er=new Error((j.error&&j.error.message)||'stream error');er.code='http';er.detail=er.message;throw er}}}
  return {text:full}};

- If his answer was very short (under ~12 words), warmly ask for more detail. If he asked you something, answer briefly first.

 if(AI){

    if(/^\s*\{/.test(full))return;const sp=full.split('###')[0].replace(/#+\s*$/,'');live.t=sp.trim();CALL.joyText=live.t;updLive(live.t);flush(sp,false)});
   const full=r.text||'';let sp,js;
   let raw;if(/^\s*\{/.test(full)){const j=parseJSON(full)||{};raw=j.reply||'';js=j}else{const parts=full.split('###');raw=parts[0].replace(/#+\s*$/,'');js=parseJSON(parts.slice(1).join('###'))||{}}
   sp=raw.trim();if(sp){res={reply:sp,fix:Array.isArray(js.fix)?js.fix:[],tip:js.tip||'',end:!!js.end};live.t=sp;CALL.joyText=sp;flush(raw,true)}

 }

}

  $('#ans').oninput=()=>{start();upd()};
  $('#mPlay').onclick=()=>{if(q.plays>=2)return toast('실제 시험처럼 최대 2번까지만 들을 수 있습니다');q.plays++;$('#mPlay').textContent=`▶ 질문 듣기 (${2-q.plays}회 남음)`;speak(q.q,()=>start())};
  $('#mShow').onclick=()=>{MK.show=!MK.show;$('#qtext').classList.toggle('hide',!MK.show);$('#mShow').textContent=MK.show?'텍스트 숨기기':'텍스트 보기'};
  $('#mMic').onclick=()=>{if(recOn){stopListen();return}const base=$('#ans').value?$('#ans').value+' ':'';if(listen(t=>{$('#ans').value=base+t;upd()},()=>{$('#mMic').classList.remove('rec');$('#mState').textContent='녹음 대기'})){start();$('#mMic').classList.add('rec');$('#mState').textContent='듣는 중… 다시 누르면 멈춤'}};
  const leave=d=>{clearInterval(timer);stopListen();upd();if(q.a.trim()&&!q.counted){q.counted=1;day().mockq++;addWords(q.a)}MK.i+=d;MK.show=false;if(MK.i>=n){MK.stage='done';MK.i=n-1}save();pMock()};
  $('#mNext').onclick=()=>leave(1);$('#mPrev').onclick=()=>leave(-1);$('#mQuit').onclick=()=>{clearInterval(timer);MK.stage='done';pMock()};
  return}
 // 결과
 const Q=MK.Q.filter(q=>q.a.trim()||q.sec);const tot=Q.reduce((a,q)=>a+q.sec,0),words=Q.reduce((a,q)=>a+(q.a.match(/[A-Za-z']+/g)||[]).length,0);const wpm=tot?Math.round(words/(tot/60)):0;
 const short=Q.filter(q=>q.sec<60).length;
 $('#page').innerHTML=`<div><span class="tag ok">결과</span><h1 style="margin-top:8px">${Q.length}문항을 마쳤어요</h1></div>
 <div class="grid g4"><div class="card kpi"><b>${Math.floor(tot/60)}분 ${tot%60}초</b><span>총 답변 시간</span></div><div class="card kpi"><b>${words}</b><span>말한 단어</span></div><div class="card kpi"><b>${wpm}</b><span>분당 단어 (WPM)</span></div><div class="card kpi"><b>${short}</b><span>1분 미만 답변</span></div></div>
 <section class="card" id="aiBox"><h2>AI 코치 채점</h2>${AI?`<p class="lead">답변 텍스트를 바탕으로 예상 등급과 고칠 점을 받아봅니다. (받아쓰기 기준이라 발음은 평가하지 않습니다)</p><button class="btn pri" id="aiGo" type="button" style="margin-top:10px">채점 받기</button>`:`<p class="lead">AI가 연결되지 않은 화면입니다. 아래 체크리스트로 스스로 점검하고, Joy 탭 &gt; AI 연결에 API 키를 넣으면 AI 채점을 받을 수 있습니다.</p>
  <ul class="li" style="margin-top:10px"><li>답변마다 1분 30초를 넘겼나요? (1분 미만 ${short}개)</li><li>경험 문항에서 끝까지 과거형을 썼나요?</li><li>롤플레이 문제 해결에서 대안을 2~3개 말했나요?</li><li>침묵 대신 필러 표현을 썼나요?</li></ul>
  <div class="row" style="margin-top:12px">${['IM2','IM3','IH','AL'].map(l=>`<button class="btn sm" data-self="${l}" type="button">자가 평가: ${l}</button>`).join('')}</div>`}<div id="aiOut" style="margin-top:12px"></div></section>
 <section class="card"><h2>문항별 기록</h2>${Q.map((q,i)=>`<div class="res"><div class="row" style="justify-content:space-between"><b>${esc(q.t)}</b><span class="mini">${Math.floor(q.sec/60)}:${String(q.sec%60).padStart(2,'0')} · ${(q.a.match(/[A-Za-z']+/g)||[]).length} 단어 ${q.sec<60?'<span class="tag bad">짧음</span>':q.sec>=90?'<span class="tag ok">좋음</span>':''}</span></div><p class="mini" style="margin-top:4px">${esc(q.q)}</p><p style="margin-top:6px;white-space:pre-wrap">${esc(q.a)||'<span class="mini">(텍스트 없음)</span>'}</p></div>`).join('')}</section>
 <div class="row"><button class="btn pri" id="mAgain" type="button">새 모의고사</button><button class="btn" data-tab="model" type="button">모범답안 보러 가기</button></div>`;
 const rec_=lv=>{ST.mocks.push({date:todayKey(),n:Q.length,wpm,level:lv});ST.mocks=ST.mocks.slice(-30);ST.sessions++;save()};
 document.querySelectorAll('[data-self]').forEach(b=>b.onclick=()=>{rec_(b.dataset.self+'(자가)');toast('기록했습니다')});
 $('#mAgain').onclick=()=>{MK={stage:'setup',sel:MK.sel};pMock()};
 if($('#aiGo'))$('#aiGo').onclick=async()=>{const b=$('#aiGo');b.disabled=true;$('#aiOut').innerHTML='<p class="mini">채점 중… (30초~1분 정도 걸릴 수 있어요)</p>';
  const prompt=`You are an expert OPIc rater and coach for Korean learners. The candidate's goal is IH. Below are his answers (speech-to-text or typed, so ignore punctuation and spelling). Answer time in seconds is given.
Rate holistically using OPIc/ACTFL criteria (paragraph-level discourse, tense control, role-play complication handling, fluency signals like length).
Return ONLY JSON:
{"level":"one of NH, IL, IM1, IM2, IM3, IH, AL","summary_ko":"2-3 문장 총평","strengths_ko":["..",".."],"items":[{"no":1,"issue_ko":"가장 중요한 문제 1개","better":"an improved IH-level version of 2-3 key sentences"}],"next_ko":["다음 연습 과제 3개"]}
Only include items for the 5 answers that need the most help.

${Q.map((q,i)=>`[${i+1}] (${q.t}, ${q.sec}s) Q: ${q.q}\nA: ${q.a||'(no answer)'}`).join('\n\n')}`;
  try{const r=await AI.json(prompt,{modelTier:'default'});rec_(r.level||'');
   $('#aiOut').innerHTML=`<div class="row"><span class="tag ${/IH|AL/.test(r.level)?'ok':'sun'}" style="font-size:16px;padding:4px 14px">예상 ${esc(r.level)}</span></div><p style="margin-top:10px">${esc(r.summary_ko)}</p>
   <h3 style="margin-top:12px">잘한 점</h3><ul class="li">${(r.strengths_ko||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
   <h3 style="margin-top:12px">고칠 점 · 업그레이드 문장</h3>${(r.items||[]).map(it=>`<div class="res"><b>Q${esc(it.no)}</b> ${esc(it.issue_ko)}<div class="fix" style="margin-top:6px">✨ ${esc(it.better)} <button class="btn sm" type="button" data-sp="${esc(it.better)}">▶</button></div></div>`).join('')}
   <h3 style="margin-top:12px">다음 연습</h3><ul class="li">${(r.next_ko||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
   document.querySelectorAll('[data-sp]').forEach(x=>x.onclick=()=>speak(x.dataset.sp))}
  catch(e){$('#aiOut').innerHTML=`<p class="bad">${esc(aiErr(e))}</p>`;b.disabled=false}};
}

// ---------- 모범답안 · 쉐도잉 ----------
let mSel=0,playing=-1;
function pModel(){
 const m=MODELS[mSel];const sents=m.a.match(/[^.!?]+[.!?]+["']?/g)||[m.a];
 const mark=s=>{let h=esc(s);m.k.forEach(k=>{const key=k.split('~')[0].trim().replace(/[.,]$/,'');if(key.length>4){const re=new RegExp('('+key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');h=h.replace(re,'<mark class="k">$1</mark>')}});return h};
 $('#page').innerHTML=`<div><span class="tag">모범답안 · 쉐도잉</span><h1 style="margin-top:8px">내 이야기로 만든 IH 모범답안 ${MODELS.length}개</h1><p class="lead" style="margin-top:8px">문장을 누르면 원어민 음성으로 듣습니다. 듣고 → 따라 말하고 → 핵심 표현(노란색)만 남기고 내 말로 바꿔 말해 보세요.</p></div>
 <div class="mlist"><div class="mitems">${MODELS.map((x,i)=>`<button type="button" class="${i===mSel?'on':''}" data-m="${i}">${esc(x.ko)}</button>`).join('')}</div>
 <section class="card"><span class="tag sun">QUESTION</span><p class="qbox" style="margin-top:8px;font-size:16px">${esc(m.q)}</p>
  <div class="row" style="margin:14px 0"><button class="btn pri" id="pAll" type="button">▶ 전체 듣기</button><button class="btn" id="pStop" type="button">■ 멈춤</button><button class="btn sun" id="pDone" type="button">✓ 쉐도잉 완료</button><span class="mini">약 ${Math.round(m.a.split(' ').length/130*60)}초 분량 · ${m.a.split(' ').length} 단어</span></div>
  <div id="sents">${sents.map((s,i)=>`<div class="sent" data-s="${i}"><span class="n">${i+1}</span><p>${mark(s.trim())}</p></div>`).join('')}</div>
  <h3 style="margin-top:16px">핵심 표현</h3><div class="row">${m.k.map(k=>`<button type="button" class="btn sm" data-sp="${esc(k.replace(/~/g,'something'))}">${esc(k)}</button>`).join('')}</div>
  ${SR?`<h3 style="margin-top:16px">따라 말하기 체크</h3><div class="row"><button class="mic" id="shMic" type="button" aria-label="따라 말하기">🎤</button><span class="mini" id="shOut">전체 답변을 따라 말해 보세요. 일치율을 보여줍니다.</span></div>`:''}
 </section></div>`;
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mSel=+b.dataset.m;pModel()});
 const hi=i=>document.querySelectorAll('.sent').forEach((e,j)=>e.classList.toggle('play',j===i));
 document.querySelectorAll('.sent').forEach(e=>e.onclick=()=>{const i=+e.dataset.s;hi(i);speak(sents[i],()=>hi(-1))});
 const playFrom=i=>{if(i>=sents.length){hi(-1);return}hi(i);speak(sents[i],()=>{if(playing===mSel)playFrom(i+1)})};
 $('#pAll').onclick=()=>{playing=mSel;playFrom(0)};$('#pStop').onclick=()=>{playing=-1;ttsCancel();hi(-1)};
 $('#pDone').onclick=()=>{day().shadow++;addWords(m.a);ST.sessions++;save();toast('쉐도잉 기록 완료! 오늘의 미션에 반영됐어요')};
 document.querySelectorAll('[data-sp]').forEach(x=>x.onclick=()=>speak(x.dataset.sp));
 if($('#shMic'))$('#shMic').onclick=()=>{if(recOn){stopListen();return}const target=(m.a.toLowerCase().match(/[a-z']+/g)||[]);if(listen(t=>{$('#shOut').textContent=t},(fin)=>{$('#shMic').classList.remove('rec');const said=new Set((fin.toLowerCase().match(/[a-z']+/g)||[]));const hit=target.filter(w=>said.has(w)).length;$('#shOut').innerHTML=`일치율 <b>${Math.round(hit/target.length*100)}%</b> · 말한 단어 ${said.size}개`;addWords(fin)}))$('#shMic').classList.add('rec')};
}

 $('#page').innerHTML=`<div><span class="tag">표현 뱅크</span><h1 style="margin-top:8px">IH 답변을 '문단'으로 묶어주는 연결 표현</h1><p class="lead" style="margin-top:8px">누르면 원어민 음성으로 들려줍니다. 하루에 한 묶음씩 소리 내어 3번 따라 하세요.</p></div>
 <div class="grid g2">${PHRASES.map(g=>`<section class="card"><h2>${esc(g.g)}</h2><div style="display:flex;flex-direction:column;gap:6px">${g.x.map(x=>`<button type="button" class="btn" style="justify-content:flex-start;text-align:left;font-weight:500" data-sp="${esc(x.replace(/~/g,'something'))}">▶ ${esc(x)}</button>`).join('')}</div></section>`).join('')}</div>`;
 document.querySelectorAll('[data-sp]').forEach(x=>x.onclick=()=>speak(x.dataset.sp));
